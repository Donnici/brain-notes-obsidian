name: Release

# The brain-notes repository pushes the plugin build and a version tag here; this turns the tag into the
# GitHub release BRAT downloads (manifest.json, main.js, styles.css).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Brain Notes $GITHUB_REF_NAME" \
            --notes "Brain Notes for Obsidian $GITHUB_REF_NAME. Install with BRAT: $GITHUB_REPOSITORY." \
            manifest.json main.js styles.css
